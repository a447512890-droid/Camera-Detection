<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TripScope 宣传图与引导图源文件</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 430px; height: 932px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; color: #0d3439; }
    .artboard { position: relative; width: 430px; height: 932px; overflow: hidden; background: #eaf8f8; }
    .order {
      position: absolute; z-index: 8; top: 24px; right: 24px; min-width: 58px; height: 30px;
      display: grid; place-items: center; border: 1px solid rgba(255,255,255,.55); border-radius: 999px;
      color: #fff; background: rgba(6,52,57,.32); backdrop-filter: blur(12px); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    }
    .promo-bg { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); object-fit: cover; filter: blur(1.2px) saturate(.86); transform: scale(1.025); }
    .promo-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,31,35,.60) 0%, rgba(7,43,47,.12) 31%, rgba(3,30,34,.07) 56%, rgba(5,34,38,.37) 100%); }
    .promo-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 28%, rgba(25,213,211,.22), transparent 38%); }
    .headline { position: absolute; z-index: 6; top: 66px; left: 24px; width: 382px; text-align: center; color: #fff; }
    .headline h1 { margin: 0; font-size: 42px; line-height: 1.08; font-weight: 950; letter-spacing: -.045em; text-shadow: 0 4px 24px rgba(0,25,28,.28); }
    .headline h1::before, .headline h1::after { color: #21d3ce; font-size: 31px; vertical-align: 3px; text-shadow: none; }
    .headline h1::before { content: "‹"; margin-right: 11px; }
    .headline h1::after { content: "›"; margin-left: 11px; }
    .headline p { margin: 15px 0 0; font-size: 18px; font-weight: 650; letter-spacing: .20em; text-shadow: 0 2px 12px rgba(0,20,24,.5); }
    .ghost { display: block; margin-top: -2px; color: rgba(255,255,255,.11); font-size: 28px; line-height: 1; font-weight: 900; letter-spacing: -.02em; text-transform: uppercase; }
    .phone-shot {
      position: absolute; z-index: 5; top: 286px; left: 57px; width: 316px; height: auto; display: block;
      border-radius: 32px; box-shadow: 0 34px 70px rgba(4,28,31,.44), 0 8px 22px rgba(4,28,31,.26);
    }
    .brand-chip { position: absolute; z-index: 7; left: 22px; bottom: 20px; color: rgba(255,255,255,.84); font-size: 11px; font-weight: 850; letter-spacing: .22em; }

    .onboarding { background: linear-gradient(150deg, #f5ffff 0%, #e7f7f7 52%, #d9f0f1 100%); }
    .onboarding::before { content: ""; position: absolute; width: 480px; height: 480px; left: -150px; top: -210px; border-radius: 50%; background: rgba(48,198,194,.14); }
    .onboarding::after { content: ""; position: absolute; width: 330px; height: 330px; right: -160px; top: 245px; border-radius: 50%; background: rgba(97,126,247,.09); }
    .onboarding .order { color: #087b84; background: rgba(255,255,255,.7); border-color: rgba(8,123,132,.18); }
    .onboard-brand { position: absolute; z-index: 4; top: 38px; left: 32px; display: flex; align-items: center; gap: 10px; color: #087e87; font-size: 14px; font-weight: 900; letter-spacing: .18em; }
    .onboard-brand span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; color: #fff; background: linear-gradient(145deg,#0fb8bd,#087d88); box-shadow: 0 8px 18px rgba(8,125,136,.22); }
    .visual { position: absolute; z-index: 2; top: 126px; left: 45px; width: 340px; height: 340px; display: grid; place-items: center; }
    .visual .halo { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(207,241,241,.8)); box-shadow: 0 30px 70px rgba(19,106,112,.14), inset 0 0 0 1px rgba(255,255,255,.8); }
    .visual .orbit { position: absolute; inset: 35px; border: 1px dashed rgba(8,148,157,.30); border-radius: 50%; }
    .visual .orbit::before, .visual .orbit::after { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 7px; background: #fff; box-shadow: 0 7px 18px rgba(8,125,136,.15); }
    .visual .orbit::before { top: 16px; right: 25px; }
    .visual .orbit::after { bottom: 22px; left: 10px; }
    .visual svg { position: relative; z-index: 2; width: 172px; height: 172px; fill: none; stroke: #0797a0; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .visual .accent { stroke: #527cf3; }
    .onboard-copy { position: absolute; z-index: 3; left: 38px; right: 38px; top: 512px; text-align: center; }
    .onboard-copy .eyebrow { margin: 0 0 10px; color: #07939d; font-size: 13px; font-weight: 900; letter-spacing: .22em; }
    .onboard-copy h1 { margin: 0; color: #0d3439; font-size: 39px; line-height: 1.16; font-weight: 950; letter-spacing: -.04em; }
    .onboard-copy p { margin: 20px auto 0; max-width: 330px; color: #55757a; font-size: 17px; line-height: 1.75; font-weight: 540; }
    .onboard-bottom { position: absolute; z-index: 4; left: 28px; right: 28px; bottom: 34px; }
    .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: #bdd5d7; }
    .dots i.active { width: 24px; border-radius: 99px; background: #08a7af; }
    .next { height: 58px; display: grid; place-items: center; border-radius: 20px; color: #fff; background: linear-gradient(135deg,#0db4b9,#087f89); box-shadow: 0 18px 30px rgba(8,127,137,.24); font-size: 16px; font-weight: 850; letter-spacing: .04em; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const params = new URLSearchParams(location.search);
    const kind = params.get('kind') || 'promo';
    const id = Math.max(1, Math.min(kind === 'promo' ? 5 : 3, Number(params.get('id') || 1)));
    const promos = [
      ['旅行安全助手', '出发前 · 旅途中 · 入住后', 'TRAVEL SAFETY', 'ui-01.png'],
      ['目的地风险查询', '出发前了解当地风险', 'DESTINATION INSIGHT', 'ui-02.png'],
      ['附近求助资源', '快速找到医院与警局', 'HELP NEARBY', 'ui-03.png'],
      ['电子档案备份', '重要证件仅存于本机', 'PRIVATE VAULT', 'ui-04.png'],
      ['住宿安全检测', '扫描可疑蓝牙与网络设备', 'ROOM SAFETY', 'ui-05.png']
    ];
    const onboardings = [
      { eyebrow: '引导 01', title: '先看目的地风险', copy: '在出发前掌握治安、灾害、诈骗与文化提醒。', icon: '<circle cx="86" cy="86" r="62"/><path d="M24 86h124M86 24c22 22 32 42 32 62s-10 40-32 62c-22-22-32-42-32-62s10-40 32-62Z"/><path class="accent" d="m114 122 16 16 30-38"/>' },
      { eyebrow: '引导 02', title: '求助资源与证件随行', copy: '快速查找附近医院与警局，重要证件仅保存在本机。', icon: '<path d="M34 148V58l52-30 52 30v90"/><path d="M22 148h128M66 148v-40h40v40"/><path class="accent" d="M86 55v34M69 72h34"/><rect x="119" y="96" width="38" height="52" rx="8"/><path d="M129 110h18M129 122h18"/>' },
      { eyebrow: '引导 03', title: '安心启程', copy: '将风险查询、附近求助和电子档案集中在一个旅行安全工具箱中。', icon: '<path d="M86 20 142 42v42c0 37-21 62-56 79-35-17-56-42-56-79V42Z"/><path class="accent" d="m56 88 20 20 40-46"/>' }
    ];
    const app = document.querySelector('#app');
    if (kind === 'promo') {
      const [title, sub, ghost, ui] = promos[id - 1];
      app.innerHTML = `<section class="artboard"><img class="promo-bg" src="../promo-bg-0${id}.png" alt=""><div class="promo-shade"></div><div class="promo-glow"></div><div class="order">${String(id).padStart(2,'0')} / 05</div><header class="headline"><h1>${title}</h1><span class="ghost">${ghost}</span><p>${sub}</p></header><img class="phone-shot" src="../${ui}" alt=""><span class="brand-chip">TRIPSCOPE</span></section>`;
    } else {
      const item = onboardings[id - 1];
      const dots = [1,2,3].map(n => `<i class="${n === id ? 'active' : ''}"></i>`).join('');
      app.innerHTML = `<section class="artboard onboarding"><div class="order">${String(id).padStart(2,'0')} / 03</div><div class="onboard-brand"><span>T</span>TRIPSCOPE</div><div class="visual"><div class="halo"></div><div class="orbit"></div><svg viewBox="0 0 172 172" aria-hidden="true">${item.icon}</svg></div><div class="onboard-copy"><p class="eyebrow">${item.eyebrow}</p><h1>${item.title}</h1><p>${item.copy}</p></div><div class="onboard-bottom"><div class="dots">${dots}</div><div class="next">${id === 3 ? '开始使用' : '继续'}</div></div></section>`;
    }
  </script>
</body>
</html>
